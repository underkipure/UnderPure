  <!-- Dynamic LCP Hero Banner Preload (Eliminates Duplicate Downloads & Adapts to Dynamic Settings) -->
  <script>
    (function () {
      try {
        var path = window.location.pathname;
        if (path !== '/' && path !== '' && !path.endsWith('/index.html')) return;

        var cached = localStorage.getItem('underpure_site_settings_cache');
        if (!cached) return;

        var heroUrl = '';
        var mediaType = 'image';
        try {
          var parsed = JSON.parse(cached);
          if (parsed && parsed.heroData) {
            mediaType = parsed.heroData.mediaType || 'image';
            heroUrl = parsed.heroData.mediaUrl || '';
          }
        } catch (err) { }

        if (!heroUrl || mediaType === 'video' || heroUrl.match(/\.(mp4|webm|mov|ogg)$/i)) {
          return;
        }

        var isMobile = window.innerWidth < 768;
        var targetWidth = isMobile ? 1000 : 1800;
        var finalUrl = heroUrl;

        if (heroUrl.indexOf('cloudinary.com') !== -1) {
          var transform = '/upload/f_auto,q_auto:best,dpr_auto,w_' + targetWidth + ',c_limit/';
          if (heroUrl.indexOf('/upload/f_auto') !== -1 || heroUrl.indexOf('/upload/q_auto') !== -1 || heroUrl.indexOf('/upload/w_') !== -1) {
            finalUrl = heroUrl.replace(/\/upload\/[^/]+\//, transform);
          } else {
            finalUrl = heroUrl.replace('/upload/', transform);
          }
        }

        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'image';
        link.href = finalUrl;
        link.fetchPriority = 'high';
        link.setAttribute('fetchpriority', 'high');
        document.head.appendChild(link);
      } catch (e) { }
    })();
  </script>
